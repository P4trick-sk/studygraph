name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env: { STUDYGRAPH_TOKEN: "${{ secrets.STUDYGRAPH_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # A private core repo needs a token with read access: set STUDYGRAPH_TOKEN as a repository secret.
      - run: git config --global url."https://x-access-token:${{ secrets.STUDYGRAPH_TOKEN }}@github.com/".insteadOf "https://github.com/"
        if: env.STUDYGRAPH_TOKEN != ''
      - run: npm install --no-audit --no-fund
      - run: npx studygraph build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
